<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Admin · Jeancarlos Arias</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#08080a; --surface:#0e0e12; --surface-2:#14141a;
    --line:rgba(255,255,255,0.08); --gold:#d8b877; --gold-hi:#f0d69b;
    --ink:#f4f1ea; --ink-soft:#b6b1a6; --ink-mute:#7c776c; --danger:#e0776b;
    --sans:"Hanken Grotesk",system-ui,sans-serif; --serif:"Fraunces",Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:
      radial-gradient(120% 50% at 50% -10%, rgba(216,184,119,0.12), transparent 60%), var(--bg);
    color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;padding:24px 16px}
  .wrap{max-width:640px;margin:0 auto}
  h1{font-family:var(--serif);font-weight:500;font-size:26px;letter-spacing:-0.01em}
  .sub{color:var(--ink-mute);font-size:13px;margin-top:2px}
  .eyebrow{font-size:10.5px;letter-spacing:0.26em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:26px 0 12px}
  .card{background:linear-gradient(180deg,var(--surface),#0b0b0e);border:1px solid var(--line);border-radius:18px;padding:20px}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-mute);font-weight:600;margin:0 0 6px}
  input,textarea{width:100%;background:rgba(0,0,0,0.35);border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--ink);font-family:var(--sans);font-size:14px;margin-bottom:14px}
  input:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(216,184,119,0.12)}
  textarea{resize:vertical}
  .btn{border:none;border-radius:11px;padding:11px 16px;font-family:var(--sans);font-weight:700;font-size:14px;cursor:pointer;transition:transform .15s,opacity .2s}
  .btn:active{transform:scale(.98)} .btn:disabled{opacity:.5;cursor:default}
  .btn-gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#241c0d;width:100%}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink-soft)}
  .btn-sm{padding:7px 12px;font-size:12.5px;font-weight:600}
  .btn-danger{background:transparent;border:1px solid rgba(224,119,107,0.4);color:var(--danger)}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .hide{display:none!important}
  .msg{font-size:12.5px;margin-top:8px;min-height:16px}
  .msg.ok{color:var(--gold)} .msg.err{color:var(--danger)}
  .rev{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:rgba(255,255,255,0.014)}
  .rev.hidden-row{opacity:.5}
  .rev-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
  .rev-name{font-weight:700;font-size:14px}
  .rev-stars{color:var(--gold);font-size:13px;letter-spacing:1px}
  .rev-body{color:var(--ink-soft);font-size:13.5px;line-height:1.5}
  .rev-meta{color:var(--ink-mute);font-size:11px;margin:8px 0}
  .rev-actions{display:flex;gap:8px}
  .pill{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-mute);border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-left:8px}
  .empty{color:var(--ink-mute);font-style:italic;font-size:13.5px;text-align:center;padding:20px}
  .warn{background:rgba(224,119,107,0.08);border:1px solid rgba(224,119,107,0.3);color:#eaa79e;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5}
  a{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ NOT CONFIGURED ============ -->
  <div id="setup-warn" class="warn hide" style="margin-bottom:20px">
    ⚠️ Supabase keys not set yet. Open <code>admin.html</code> and paste your project URL +
    anon key into the CONFIG block at the top of the script, same as in <code>index.html</code>.
  </div>

  <!-- ============ LOGIN ============ -->
  <div id="login-view" class="hide">
    <h1>Card Admin</h1>
    <p class="sub">Sign in to manage reviews and your profile.</p>
    <div class="card" style="margin-top:20px">
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required>
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
        <button class="btn btn-gold" type="submit" id="login-btn">Sign in</button>
        <div class="msg" id="login-msg"></div>
      </form>
    </div>
  </div>

  <!-- ============ DASHBOARD ============ -->
  <div id="dash-view" class="hide">
    <div class="topbar">
      <div>
        <h1>Card Admin</h1>
        <p class="sub" id="who"></p>
      </div>
      <button class="btn btn-ghost btn-sm" id="logout-btn">Sign out</button>
    </div>

    <div class="eyebrow">Your Profile</div>
    <div class="card">
      <label for="p-name">Name</label>
      <input type="text" id="p-name" maxlength="80">
      <label for="p-title">Title</label>
      <input type="text" id="p-title" maxlength="120">
      <label for="p-phone">Phone (with country code, e.g. +17817967276)</label>
      <input type="text" id="p-phone" maxlength="24">
      <label for="p-email">Email</label>
      <input type="text" id="p-email" maxlength="120">
      <label for="p-bio">Bio (leave blank to hide the About section)</label>
      <textarea id="p-bio" rows="4" maxlength="600"></textarea>
      <label for="p-avatar">Avatar image URL (optional — blank = initials)</label>
      <input type="text" id="p-avatar" maxlength="400">
      <button class="btn btn-gold" id="save-profile">Save profile</button>
      <div class="msg" id="profile-msg"></div>
    </div>

    <div class="eyebrow">Reviews <span id="rev-count" class="pill"></span></div>
    <div id="reviews"></div>
  </div>

</div>

<script>
  /* ============================================================
     CONFIG — paste the SAME URL + anon key you used in index.html.
     ⚠️ anon key ONLY. Never the service_role key.
     ============================================================ */
  const SUPABASE_URL      = "https://fvceuzbrneymsqprzisp.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2Y2V1emJybmV5bXNxcHJ6aXNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNDkyOTQsImV4cCI6MjEwMDYyNTI5NH0.Fgr8Ki7CVhOsFRPnyVMlLwrlhNvKOIYh3SvAzh2rIv0";

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  const CONFIGURED = /^https?:\/\//.test(SUPABASE_URL) && SUPABASE_ANON_KEY.length > 20;
  let sb = null;

  function show(view){ ["setup-warn","login-view","dash-view"].forEach(v => $(v).classList.add("hide")); if (view) $(view).classList.remove("hide"); }

  if (!CONFIGURED) {
    show("setup-warn");
  } else {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    init();
  }

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) enterDash(session); else show("login-view");

    sb.auth.onAuthStateChange((_e, s) => {
      if (s) enterDash(s); else show("login-view");
    });
  }

  /* ---------- Login ---------- */
  $("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("login-btn"), m = $("login-msg");
    btn.disabled = true; m.textContent = ""; m.className = "msg";
    const { error } = await sb.auth.signInWithPassword({
      email: $("email").value.trim(),
      password: $("password").value
    });
    btn.disabled = false;
    if (error) { m.textContent = error.message; m.className = "msg err"; }
  });

  $("logout-btn").addEventListener("click", () => sb.auth.signOut());

  /* ---------- Dashboard ---------- */
  async function enterDash(session) {
    show("dash-view");
    $("who").textContent = "Signed in as " + session.user.email;
    await loadProfile();
    await loadReviews();
  }

  async function loadProfile() {
    const { data } = await sb.from("profile").select("*").eq("id", 1).maybeSingle();
    if (!data) return;
    $("p-name").value   = data.name || "";
    $("p-title").value  = data.title || "";
    $("p-phone").value  = data.phone || "";
    $("p-email").value  = data.email || "";
    $("p-bio").value    = data.bio || "";
    $("p-avatar").value = data.avatar_url || "";
  }

  $("save-profile").addEventListener("click", async () => {
    const btn = $("save-profile"), m = $("profile-msg");
    btn.disabled = true; m.textContent = "Saving…"; m.className = "msg";
    const { error } = await sb.from("profile").update({
      name:  $("p-name").value.trim(),
      title: $("p-title").value.trim(),
      phone: $("p-phone").value.trim(),
      email: $("p-email").value.trim(),
      bio:   $("p-bio").value.trim(),
      avatar_url: $("p-avatar").value.trim(),
      updated_at: new Date().toISOString()
    }).eq("id", 1);
    btn.disabled = false;
    if (error) { m.textContent = error.message; m.className = "msg err"; }
    else { m.textContent = "Saved. Your card now shows these details."; m.className = "msg ok"; }
  });

  async function loadReviews() {
    const box = $("reviews");
    const { data, error } = await sb.from("reviews").select("*").order("created_at", { ascending: false });
    if (error) { box.innerHTML = '<div class="empty">Could not load reviews.</div>'; return; }
    $("rev-count").textContent = data.length + " total";
    if (!data.length) { box.innerHTML = '<div class="empty">No reviews yet.</div>'; return; }

    box.innerHTML = data.map(r => `
      <div class="rev ${r.hidden ? "hidden-row" : ""}">
        <div class="rev-top">
          <span class="rev-name">${esc(r.name)}${r.hidden ? '<span class="pill">Hidden</span>' : ''}</span>
          <span class="rev-stars">${"★".repeat(r.rating)}${"☆".repeat(5 - r.rating)}</span>
        </div>
        <div class="rev-body">${esc(r.comment)}</div>
        <div class="rev-meta">${new Date(r.created_at).toLocaleString()}</div>
        <div class="rev-actions">
          <button class="btn btn-ghost btn-sm" data-act="toggle" data-id="${r.id}" data-hidden="${r.hidden}">
            ${r.hidden ? "Show" : "Hide"}
          </button>
          <button class="btn btn-danger btn-sm" data-act="delete" data-id="${r.id}">Delete</button>
        </div>
      </div>
    `).join("");
  }

  $("reviews").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const id = btn.dataset.id;
    if (btn.dataset.act === "toggle") {
      const newHidden = btn.dataset.hidden !== "true";
      await sb.from("reviews").update({ hidden: newHidden }).eq("id", id);
      loadReviews();
    } else if (btn.dataset.act === "delete") {
      if (!confirm("Permanently delete this review?")) return;
      await sb.from("reviews").delete().eq("id", id);
      loadReviews();
    }
  });
</script>
</body>
</html>
